<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mapa de calor — Intensidad de cartera</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{ --bg:#0c0f14; --panel:#141a22; --ink:#e8eef5; --muted:#94a2b2; --line:#262f3a; --accent:#4c8dff; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header{
  padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; flex:0 0 auto;
}
header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.2px}
header h1 small{display:block; color:var(--muted); font-weight:400; font-size:11px; letter-spacing:0}
main{flex:1 1 auto; display:flex; min-height:0}
#side{width:300px; flex:0 0 300px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
#map{flex:1 1 auto; background:#0c0f14}
.blk{padding:12px 14px; border-bottom:1px solid var(--line)}
.blk h2{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:0 0 8px}
.row{display:flex; gap:5px}
button.chip{
  font:inherit; font-size:12px; cursor:pointer; padding:5px 9px; border-radius:999px;
  background:#0f141b; color:var(--muted); border:1px solid var(--line); flex:1; text-align:center;
}
button.chip:hover{color:var(--ink); border-color:#3a4756}
button.chip.on{background:var(--accent); border-color:var(--accent); color:#06101f; font-weight:600}
input[type=search]{width:100%; font:inherit; font-size:13px; padding:6px 9px; border-radius:6px; background:#0f141b; border:1px solid var(--line); color:var(--ink)}
input[type=search]::placeholder{color:#5d6b7c}
#rank{flex:1 1 auto; overflow:auto; padding:4px 0 20px}
#rank .it{display:flex; align-items:center; gap:9px; padding:6px 14px; cursor:pointer; font-size:12.5px; border-left:3px solid transparent}
#rank .it:hover{background:#1a2129; border-left-color:var(--accent)}
#rank .it .sw{width:11px; height:11px; border-radius:3px; flex:0 0 auto; border:1px solid rgba(0,0,0,.35)}
#rank .it .nm{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#rank .it .nm em{display:block; font-style:normal; color:#5d6b7c; font-size:10.5px}
#rank .it .lv{font-size:10.5px; color:var(--muted); text-align:right; flex:0 0 auto}
.grp{padding:12px 14px 4px; font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:#5d6b7c}
.legend{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; color:var(--ink); box-shadow:0 4px 18px rgba(0,0,0,.45)}
.legend h3{margin:0 0 6px; font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:600}
.legend .sc{display:flex; height:9px; border-radius:3px; overflow:hidden; min-width:200px}
.legend .sc i{flex:1}
.legend .lb{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:4px}
.leaflet-container{background:#0c0f14; font:inherit}
.leaflet-tooltip.tt{background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:7px; box-shadow:0 4px 18px rgba(0,0,0,.5); font-size:12px; padding:8px 10px}
.leaflet-tooltip.tt:before{display:none}
.tt b{font-size:13px}
.tt .lvl{display:flex; align-items:center; gap:6px; margin-top:5px; font-size:12px}
.tt .lvl i{width:11px; height:11px; border-radius:3px; display:inline-block}
.note{font-size:11px; color:#5d6b7c; padding:0 14px 12px; line-height:1.4}
#load{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:900; background:rgba(12,15,20,.92); color:var(--muted); font-size:13px; flex-direction:column; gap:8px}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:820px){
  main{flex-direction:column} #side{width:auto; flex:0 0 auto; max-height:46vh; border-right:0; border-bottom:1px solid var(--line)}
  #map{min-height:54vh}
}
</style>
</head>
<body>

<header>
  <h1>Mapa de calor — Intensidad de cartera
    <small>Julio 2026 · intensidad relativa por provincia y localidad · sin cifras</small>
  </h1>
</header>

<main>
  <div id="side">
    <div class="blk">
      <h2>Vista</h2>
      <div class="row" id="views">
        <button class="chip on" data-v="prov">Provincias</button>
        <button class="chip" data-v="loc">Localidades</button>
        <button class="chip" data-v="dens">Densidad</button>
      </div>
    </div>
    <div class="blk">
      <input type="search" id="q" placeholder="Buscar provincia o localidad…" autocomplete="off">
    </div>
    <div id="rank"></div>
    <div class="note" id="foot"></div>
  </div>
  <div id="map"><div id="load"><div class="spin"></div><span>Cargando geografía…</span></div></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
/* ============================================================
   Intensidad de cartera — vista sin datos numéricos
   datos.json contiene únicamente el nivel de intensidad (0-6).
   No incluye recuentos de pólizas ni desglose por segmento.
   ============================================================ */

const GEOJSON = 'https://cdn.jsdelivr.net/gh/codeforgermany/click_that_hood@main/public/data/spain-provinces.geojson';
const CPCSV   = 'https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/geonames-postal-code/exports/csv?where=country_code%3D%22ES%22&limit=-1';
const CACHE_K = 'cp-es-v1';
const RAMP = ['#fff7bc','#fee391','#fec44f','#fe9929','#ec7014','#cc4c02','#8c2d04'];

let DATA, GEO, CPXY = null, view = 'prov', activeProv = null;

const map = L.map('map', { zoomControl:true, minZoom:5, maxZoom:15, preferCanvas:true })
  .setView([40.2, -3.6], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd', maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a> · CP: GeoNames'
}).addTo(map);

const canvas = L.canvas({ padding:.4 });
let provLayer = null, locLayer = null, densLayer = null;

const colorFor = k => k >= 0 ? RAMP[k] : '#e9edf1';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function boot(){
  const [d, g] = await Promise.all([
    fetch('datos.json').then(r=>r.json()),
    fetch(GEOJSON).then(r=>r.json())
  ]);
  DATA = d; GEO = g;
  DATA.byProv = {}; DATA.locByProv = {};
  DATA.prov.forEach(p => DATA.byProv[p.c] = p);
  DATA.loc.forEach(l => (DATA.locByProv[l.c] = DATA.locByProv[l.c] || []).push(l));
  drawProvinces();
  document.getElementById('load').remove();
  render();
  loadCP();
}

function drawProvinces(){
  provLayer = L.geoJSON(GEO, {
    style: styleProv,
    onEachFeature: (f, layer) => {
      const p = DATA.byProv[f.properties.cod_prov];
      layer.on({
        mouseover: e => { e.target.setStyle({ weight:2, color:'#0c0f14' }); e.target.bringToFront(); },
        mouseout:  e => provLayer.resetStyle(e.target),
        click: () => selectProv(f.properties.cod_prov)
      });
      layer.bindTooltip(() => tip(p ? p.n : 'Sin datos', '', p ? p.k : -1, true), { className:'tt', sticky:true });
    }
  }).addTo(map);
}

function styleProv(f){
  const p = DATA.byProv[f.properties.cod_prov];
  const on = view === 'prov';
  return {
    fillColor: on && p ? colorFor(p.k) : '#ffffff',
    fillOpacity: on ? .82 : .02,
    weight: activeProv === f.properties.cod_prov ? 2.2 : .7,
    color: on ? '#6b7684' : '#8895a5',
    opacity: on ? .9 : .55
  };
}

function tip(name, sub, k, clic){
  const lv = k >= 0 ? DATA.niveles[k] : 'Sin datos';
  return `<b>${esc(name)}</b>${sub ? `<div style="color:#94a2b2;font-size:11px">${esc(sub)}</div>` : ''}
    <div class="lvl"><i style="background:${colorFor(k)}"></i>Intensidad ${esc(lv.toLowerCase())}</div>
    ${clic ? '<div style="color:#5d6b7c;font-size:10px;margin-top:5px">clic para ver localidades</div>' : ''}`;
}

/* ---------- localidades ---------- */
async function loadCP(){
  try{
    let txt = null;
    try{ txt = localStorage.getItem(CACHE_K); }catch(e){}
    if(!txt){
      const r = await fetch(CPCSV);
      if(!r.ok) throw new Error('CP ' + r.status);
      const idx = {};
      (await r.text()).split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(';');
        const cp = (c[1]||'').trim(), la = parseFloat(c[9]), lo = parseFloat(c[10]);
        if(cp && !idx[cp] && isFinite(la) && isFinite(lo)) idx[cp] = [la, lo];
      });
      const need = {};
      DATA.loc.forEach(l => { if(idx[l.cp]) need[l.cp] = idx[l.cp]; });
      txt = JSON.stringify(need);
      try{ localStorage.setItem(CACHE_K, txt); }catch(e){}
    }
    CPXY = JSON.parse(txt);
    const hit = DATA.loc.filter(l => CPXY[l.cp]).length;
    document.getElementById('foot').textContent =
      'Geolocalización por código postal: ' + Math.round(hit / DATA.loc.length * 100) + '% de las localidades.';
    if(view !== 'prov') render();
  }catch(e){
    CPXY = 'err';
    document.getElementById('foot').textContent = 'No se han podido cargar las coordenadas de los códigos postales; las vistas de localidad no están disponibles.';
  }
}

function locPoints(){
  if(!CPXY || CPXY === 'err') return [];
  return DATA.loc.map(l => {
    const xy = CPXY[l.cp];
    return xy ? { l, la:xy[0], lo:xy[1] } : null;
  }).filter(Boolean);
}

function drawLoc(pts){
  locLayer = L.layerGroup();
  pts.forEach(p => {
    L.circleMarker([p.la, p.lo], {
      renderer: canvas, radius: 2.4 + p.l.k * 1.9,
      fillColor: colorFor(p.l.k), fillOpacity:.78, color:'#5b3b12', weight:.4, opacity:.5
    }).bindTooltip(() => tip(p.l.l, p.l.cp + ' · ' + (DATA.byProv[p.l.c]||{}).n, p.l.k, false),
      { className:'tt' }).addTo(locLayer);
  });
  locLayer.addTo(map);
}

function drawDens(pts){
  densLayer = L.heatLayer(pts.map(p => [p.la, p.lo, (p.l.k + 1) / 7]), {
    radius: 17, blur: 22, maxZoom: 11, minOpacity:.25,
    gradient: { 0:'#ffffcc', .25:'#fed976', .5:'#fd8d3c', .72:'#e31a1c', 1:'#800026' }
  }).addTo(map);
}

/* ---------- leyenda ---------- */
const legend = L.control({ position:'bottomright' });
legend.onAdd = () => { const d = L.DomUtil.create('div','legend'); d.id = 'lg'; return d; };
legend.addTo(map);
function drawLegend(){
  const el = document.getElementById('lg'); if(!el) return;
  el.innerHTML = `<h3>Intensidad de cartera</h3>
    <div class="sc">${RAMP.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
    <div class="lb"><span>${DATA.niveles[0]}</span><span>${DATA.niveles[6]}</span></div>`;
}

/* ---------- listado ---------- */
function drawList(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const box = document.getElementById('rank');
  const isLoc = view !== 'prov' || activeProv || q.length >= 2;
  let items;
  if(isLoc){
    let src = activeProv && !q ? (DATA.locByProv[activeProv] || []) : DATA.loc;
    if(q) src = src.filter(l => l.l.toLowerCase().includes(q) || l.cp.startsWith(q) || (DATA.byProv[l.c]||{}).n.toLowerCase().includes(q));
    items = src.map(l => ({ o:l, k:l.k, nm:l.l, sub:l.cp + ' · ' + (DATA.byProv[l.c]||{}).n, loc:true }));
  }else{
    items = DATA.prov.map(p => ({ o:p, k:p.k, nm:p.n, sub:'', loc:false }));
  }
  const shown = items.slice(0, 250);
  let html = '', last = null;
  shown.forEach((i,k) => {
    if(i.k !== last){ html += `<div class="grp">Intensidad ${esc(DATA.niveles[i.k].toLowerCase())}</div>`; last = i.k; }
    html += `<div class="it" data-k="${k}">
      <span class="sw" style="background:${colorFor(i.k)}"></span>
      <span class="nm">${esc(i.nm)}${i.sub ? `<em>${esc(i.sub)}</em>` : ''}</span>
    </div>`;
  });
  box.innerHTML = html || '<div class="note" style="padding-top:10px">Sin resultados.</div>';
  if(items.length > shown.length)
    box.innerHTML += '<div class="note" style="padding-top:8px">Se muestran las primeras 250. Usa el buscador para acotar.</div>';

  [...box.querySelectorAll('.it')].forEach(el => el.onclick = () => {
    const i = shown[+el.dataset.k];
    if(i.loc){
      const xy = CPXY && CPXY !== 'err' ? CPXY[i.o.cp] : null;
      if(xy) map.flyTo(xy, 12, { duration:.7 }); else selectProv(i.o.c);
    } else selectProv(i.o.c);
  });
}

function selectProv(code){
  activeProv = activeProv === code ? null : code;
  const f = GEO.features.find(x => x.properties.cod_prov === code);
  if(activeProv && f) map.fitBounds(L.geoJSON(f).getBounds(), { padding:[30,30] });
  else map.flyTo([40.2,-3.6], 6, { duration:.6 });
  provLayer.setStyle(styleProv);
  drawList();
}

function render(){
  if(locLayer){ map.removeLayer(locLayer); locLayer = null; }
  if(densLayer){ map.removeLayer(densLayer); densLayer = null; }
  provLayer.setStyle(styleProv);
  if(view !== 'prov'){
    const pts = locPoints();
    if(pts.length) view === 'loc' ? drawLoc(pts) : drawDens(pts);
  }
  drawLegend(); drawList();
}

document.getElementById('views').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.v !== 'prov' && (!CPXY || CPXY === 'err')){
    alert(CPXY === 'err' ? 'No se han podido cargar las coordenadas de los códigos postales.' : 'Cargando coordenadas de códigos postales, espera unos segundos…');
    return;
  }
  view = b.dataset.v;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  render();
};
let t; document.getElementById('q').oninput = () => { clearTimeout(t); t = setTimeout(drawList, 180); };

boot().catch(e => {
  const l = document.getElementById('load');
  if(l) l.innerHTML = '<span style="color:#ff8a80">Error cargando los datos: ' + esc(e.message) + '</span>';
});
</script>
</body>
</html>
