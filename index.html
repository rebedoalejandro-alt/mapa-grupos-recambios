<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--panel:#141a22;--ink:#e8eef5;--muted:#94a2b2;--line:#262f3a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0c0f14;color:var(--ink)}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden}
  #map{flex:1;height:100%;background:#dfeaf2}
  #side{width:330px;min-width:330px;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  header.h{padding:14px 16px;border-bottom:1px solid var(--line)}
  header.h h1{font-size:15px;margin:0 0 5px}
  header.h p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.5}
  .tools{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px}
  .tools input{flex:1;background:#0c0f14;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 9px;font-size:13px}
  .tools button{background:#0c0f14;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer}
  #groups{padding:8px 12px;border-bottom:1px solid var(--line)}
  .grp{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .grp:hover{background:#1c2530}
  .grp input{width:16px;height:16px;accent-color:#4c8dff;cursor:pointer}
  .sw{width:16px;height:16px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.45)}
  .grp .nm{font-size:13.5px;font-weight:700}
  .grp .mt{font-size:11px;color:var(--muted)}
  .grp.off{opacity:.42}
  .note{padding:10px 16px;font-size:10.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);margin-top:auto}
  .leaflet-pane.inf-pane{filter:blur(7px)}
  .pop b{font-size:13px}.pop .a{color:#566;font-size:11.5px}
  .leaflet-popup-content{font-size:12.5px;line-height:1.4;margin:9px 12px}
  .legend-mini{font-size:11px;color:var(--muted);padding:0 16px 12px}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="side">
    <header class="h">
      <h1>Zonas de influencia — Grupos de recambios</h1>
      <p>Mancha de aceite de cobertura por grupo de distribución. Activa/desactiva cada capa con su casilla. <b id="tot"></b> puntos en total (solo España).</p>
    </header>
    <div class="tools">
      <input id="q" type="text" placeholder="Buscar socio o ciudad…" />
      <button id="reset">Reset</button>
    </div>
    <div id="groups"></div>
    <div class="legend-mini">Punto = almacén / punto de venta. Mancha = zona estimada de influencia por cercanía.</div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
const G=window.GROUPS.groups, P=window.GROUPS.points;
document.getElementById('tot').textContent=P.length;

const map=L.map('map',{minZoom:5,maxZoom:13}).setView([40.2,-3.6],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
 {attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
map.createPane('inf-pane'); map.getPane('inf-pane').classList.add('inf-pane'); map.getPane('inf-pane').style.zIndex=350;

const RADIUS=24000;
const layers={};      // gid -> {inf:[], dots:[], lg:LayerGroup, on:true}
G.forEach(g=>layers[g.id]={inf:[],dots:[],lg:L.layerGroup(),on:true});

P.forEach((p,idx)=>{
  const g=G[p.g], col=g.color;
  const halo=L.circle([p.la,p.ln],{radius:RADIUS,pane:'inf-pane',stroke:false,fillColor:col,fillOpacity:0.18});
  const core=L.circle([p.la,p.ln],{radius:RADIUS*0.5,pane:'inf-pane',stroke:false,fillColor:col,fillOpacity:0.26});
  const dot=L.circleMarker([p.la,p.ln],{radius:3.4,color:'#0c0f14',weight:1,fillColor:col,fillOpacity:1});
  dot.bindPopup(`<div class="pop"><b>${p.n}</b><br><span class="a">${p.c?p.c+' · ':''}${g.name}</span></div>`);
  p._dot=dot;p._halo=halo;p._core=core;
  layers[p.g].inf.push(halo,core); layers[p.g].dots.push(dot);
  layers[p.g].lg.addLayer(halo);layers[p.g].lg.addLayer(core);layers[p.g].lg.addLayer(dot);
});
G.forEach(g=> layers[g.id].lg.addTo(map));

const allB=L.latLngBounds(P.map(p=>[p.la,p.ln]));
map.fitBounds(allB,{padding:[25,25]});

function toggle(gid,on){
  layers[gid].on=on;
  if(on) layers[gid].lg.addTo(map); else map.removeLayer(layers[gid].lg);
  document.querySelector(`.grp[data-g="${gid}"]`).classList.toggle('off',!on);
}
function emphasize(gid){
  G.forEach(g=>{
    const o=(g.id===gid)?1:0.12;
    layers[g.id].inf.forEach((l,k)=> l.setStyle({fillOpacity:(g.id===gid)?(k%2?0.30:0.20):0.03}));
    layers[g.id].dots.forEach(d=> d.setStyle({fillOpacity:(g.id===gid)?1:0.12,radius:(g.id===gid)?4.5:2.4}));
  });
}
function restore(){
  G.forEach(g=>{layers[g.id].inf.forEach((l,k)=> l.setStyle({fillOpacity:k%2?0.26:0.18}));
    layers[g.id].dots.forEach(d=> d.setStyle({fillOpacity:1,radius:3.4}));});
}

const cont=document.getElementById('groups');
G.forEach(g=>{
  const row=document.createElement('label');row.className='grp';row.dataset.g=g.id;
  row.innerHTML=`<input type="checkbox" checked>
    <span class="sw" style="background:${g.color}"></span>
    <span><span class="nm">${g.name}</span><br><span class="mt">${g.n} puntos · ${g.socios} socios</span></span>`;
  const cb=row.querySelector('input');
  cb.addEventListener('change',()=>toggle(g.id,cb.checked));
  row.addEventListener('mouseenter',()=>{if(cb.checked)emphasize(g.id);});
  row.addEventListener('mouseleave',restore);
  cont.appendChild(row);
});

document.getElementById('note').innerHTML=
 'SERCA y CGA: todos los puntos de venta (localizadores oficiales). AD y GAUB: sedes de cada socio + delegaciones verificadas (cobertura parcial; estos grupos no publican localizador completo). Coordenadas a nivel de municipio. Fuentes: serca.es, grupocga.com, adparts.com, groupautounioniberica.com y webs de los socios.';

// búsqueda: aísla puntos que coinciden
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){restore();return;}
  G.forEach(g=>{
    layers[g.id].inf.forEach(l=> l.setStyle({fillOpacity:0.02}));
  });
  P.forEach(p=>{
    const hit=(p.n.toLowerCase().includes(v)||(p.c||'').toLowerCase().includes(v)) && layers[p.g].on;
    p._dot.setStyle({fillOpacity:hit?1:0.08,radius:hit?5.5:2});
    p._halo.setStyle({fillOpacity:hit?0.22:0.02}); p._core.setStyle({fillOpacity:hit?0.30:0.02});
  });
});
document.getElementById('reset').addEventListener('click',()=>{
  q.value='';
  G.forEach(g=>{const r=document.querySelector(`.grp[data-g="${g.id}"]`);const cb=r.querySelector('input');if(!cb.checked){cb.checked=true;toggle(g.id,true);}});
  restore(); map.fitBounds(allB,{padding:[25,25]});
});
</script>
