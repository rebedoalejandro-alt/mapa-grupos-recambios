<script>
const D=window.GROUPS,GROUPS=D.groups,POINTS=D.points;
const gSoc={};GROUPS.forEach(g=>{gSoc[g.id]=[...new Set(POINTS.filter(p=>p.g===g.id).map(p=>p.s))].sort((a,b)=>a.localeCompare(b,'es'));});
const socColor={};GROUPS.forEach(g=>{socColor[g.id]={};gSoc[g.id].forEach((s,i)=>{socColor[g.id][s]=`hsl(${Math.round((i*137.508)%360)},${i%2?62:75}%,${i%3?50:43}%)`;});});
POINTS.forEach((p,i)=>p._i=i);

const map=L.map('map',{minZoom:5,maxZoom:14}).setView([40.2,-3.6],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
map.createPane('infp');map.getPane('infp').classList.add('infp');map.getPane('infp').style.zIndex=350;
const R=22000;
let stainLayer=L.layerGroup().addTo(map),dotLayer=L.layerGroup().addTo(map);
let drawn=[];           // {p,halo,core,dot,key} key=group-color o socio
let view='main', locked=null;

function clear(){stainLayer.clearLayers();dotLayer.clearLayers();drawn=[];}
function addPoint(p,color,key){
 const halo=L.circle([p.la,p.ln],{radius:R,pane:'infp',stroke:false,fillColor:color,fillOpacity:0.17});
 const core=L.circle([p.la,p.ln],{radius:R*0.5,pane:'infp',stroke:false,fillColor:color,fillOpacity:0.25});
 const dot=L.circleMarker([p.la,p.ln],{radius:3.3,color:'#0c0f14',weight:1,fillColor:color,fillOpacity:1});
 const g=GROUPS[p.g];
 dot.bindPopup(`<div class="pop"><b>${p.s}</b><br><span class="a">${p.a?p.a+'<br>':''}${p.c?p.c+' · ':''}${g.name}</span></div>`);
 stainLayer.addLayer(halo);stainLayer.addLayer(core);dotLayer.addLayer(dot);
 drawn.push({p,halo,core,dot,key});
}
function fitAll(pts){try{map.fitBounds(L.latLngBounds(pts.map(p=>[p.la,p.ln])),{padding:[25,25]});}catch(e){}}

// ----- MAIN VIEW -----
function renderMain(){
 view='main';locked=null;clear();
 const onG={};GROUPS.forEach(g=>onG[g.id]=true);
 GROUPS.forEach(g=>POINTS.filter(p=>p.g===g.id).forEach(p=>addPoint(p,g.color,'g'+g.id)));
 fitAll(POINTS);
 document.getElementById('vtit').textContent='Vista principal — 4 grupos';
 document.getElementById('vsub').innerHTML='Cobertura por grupo. Activa/desactiva cada capa con su casilla. <b>'+POINTS.length+'</b> puntos en total.';
 const leg=document.getElementById('legend');leg.innerHTML='';
 GROUPS.forEach(g=>{
  const r=document.createElement('label');r.className='row';r.style.cursor='pointer';
  r.innerHTML=`<input type="checkbox" checked style="width:16px;height:16px;accent-color:${g.color}"><span class="sw" style="background:${g.color}"></span><span><span class="nm">${g.name}</span><br><span class="mt">${g.n} puntos · ${g.socios} socios</span></span>`;
  const cb=r.querySelector('input');
  cb.addEventListener('change',()=>{drawn.forEach(d=>{if(d.key==='g'+g.id){const m=cb.checked?'add':'remove';if(cb.checked){stainLayer.addLayer(d.halo);stainLayer.addLayer(d.core);dotLayer.addLayer(d.dot);}else{stainLayer.removeLayer(d.halo);stainLayer.removeLayer(d.core);dotLayer.removeLayer(d.dot);}}});});
  r.addEventListener('mouseenter',()=>emph('g'+g.id));
  r.addEventListener('mouseleave',()=>{if(locked===null)unemph();});
  leg.appendChild(r);
 });
 document.getElementById('foot').innerHTML='SERCA y CGA: todos los puntos (localizadores oficiales). AD y GAUB: socios + delegaciones verificadas en sus webs. Coordenadas a nivel municipal/calle.';
}

// ----- GROUP VIEW (por socio) -----
function renderGroup(gid){
 view=gid;locked=null;clear();
 const g=GROUPS[gid];const pts=POINTS.filter(p=>p.g===gid);
 pts.forEach(p=>addPoint(p,socColor[gid][p.s],'s|'+p.s));
 fitAll(pts);
 document.getElementById('vtit').innerHTML=`<span style="color:${g.color}">${g.name}</span> — socios por color`;
 document.getElementById('vsub').innerHTML=`${g.n} puntos de ${g.socios} socios. Pasa el ratón o pulsa un socio para aislar su zona.`;
 const leg=document.getElementById('legend');leg.innerHTML='';
 gSoc[gid].forEach(s=>{
  const n=pts.filter(p=>p.s===s).length;
  const r=document.createElement('div');r.className='row';r.dataset.s=s;
  r.innerHTML=`<span class="sw" style="background:${socColor[gid][s]}"></span><span class="nm">${s}</span><span class="cnt">${n}</span>`;
  r.addEventListener('mouseenter',()=>{if(locked===null)emph('s|'+s);});
  r.addEventListener('mouseleave',()=>{if(locked===null)unemph();});
  r.addEventListener('click',()=>{if(locked===s){locked=null;unemph();fitAll(pts);}else{locked=s;emph('s|'+s);fitAll(pts.filter(p=>p.s===s));}});
  leg.appendChild(r);
 });
 document.getElementById('foot').innerHTML = (gid===0||gid===1)?'Todos los puntos de venta (fuente oficial del grupo).':'Socios + delegaciones verificadas en las webs de cada socio (cobertura puede ser parcial).';
}

function emph(key){drawn.forEach(d=>{const on=d.key===key;d.halo.setStyle({fillOpacity:on?0.22:0.03});d.core.setStyle({fillOpacity:on?0.30:0.03});d.dot.setStyle({fillOpacity:on?1:0.12,radius:on?5:2.3});});}
function unemph(){drawn.forEach(d=>{d.halo.setStyle({fillOpacity:0.17});d.core.setStyle({fillOpacity:0.25});d.dot.setStyle({fillOpacity:1,radius:3.3});});}

// search
document.getElementById('q').addEventListener('input',e=>{
 const v=e.target.value.trim().toLowerCase();
 if(!v){unemph();document.querySelectorAll('#legend .row').forEach(r=>r.classList.remove('dim'));return;}
 drawn.forEach(d=>{const hit=(d.p.s.toLowerCase().includes(v)||(d.p.c||'').toLowerCase().includes(v));d.dot.setStyle({fillOpacity:hit?1:0.08,radius:hit?5:2});d.halo.setStyle({fillOpacity:hit?0.22:0.02});d.core.setStyle({fillOpacity:hit?0.30:0.02});});
 document.querySelectorAll('#legend .row').forEach(r=>{const s=r.dataset.s;r.classList.toggle('dim', s? !s.toLowerCase().includes(v):false);});
});
document.getElementById('reset').addEventListener('click',()=>{document.getElementById('q').value='';locked=null;view==='main'?renderMain():renderGroup(view);});

// tabs
const tabs=document.getElementById('tabs');
function mkTab(label,color,fn,id){const t=document.createElement('div');t.className='tab';t.dataset.id=id;t.innerHTML=(color?`<span class="dot" style="background:${color}"></span>`:'')+label;t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');fn();});tabs.appendChild(t);return t;}
const t0=mkTab('Principal','',renderMain,'main');
GROUPS.forEach(g=>mkTab(g.name,g.color,()=>renderGroup(g.id),'g'+g.id));
t0.classList.add('active');renderMain();
</script></body></html>
